name: NeuroRVQ tokenizer rebase validation

on:
  pull_request:
    branches:
      - base/upstream-master-28b51ff
    paths:
      - "braindecode/models/_neurorvq_tokenizer_components.py"
      - "braindecode/models/neurorvq_tokenizer.py"
      - "braindecode/models/__init__.py"
      - "braindecode/models/util.py"
      - "braindecode/models/summary.csv"
      - "test/unit_tests/models/test_neurorvq_tokenizer.py"
      - "test/unit_tests/models/test_integration.py"
      - "scripts/validate_neurorvq_tokenizer_parity.py"
      - ".github/workflows/tokenizer-rebase-validation.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff
      - name: Focused tokenizer tests
        run: |
          python -m pytest -q test/unit_tests/models/test_neurorvq_tokenizer.py
          python -m pytest -q test/unit_tests/models/test_integration.py -k NeuroRVQTokenizer
      - name: Changed Python lint
        run: |
          ruff check braindecode/models/_neurorvq_tokenizer_components.py             braindecode/models/neurorvq_tokenizer.py             test/unit_tests/models/test_neurorvq_tokenizer.py             scripts/validate_neurorvq_tokenizer_parity.py
