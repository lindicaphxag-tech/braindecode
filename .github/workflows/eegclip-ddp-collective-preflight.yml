name: EEGCLIP distributed synchronized-rejection and DDP regression
on:
  push:
    branches:
      - "research/eegclip-global-ack-preflight-20261013"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-rank-preflight:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Braindecode and official tests
        run: python -m pip install --disable-pip-version-check -e ".[tests]"
      - name: Verify no deadlocked collectives and original global DDP equivalence
        run: >-
          python -m pytest -q test/unit_tests/models/test_models.py
          -k "eegclip_global_collective_preflight or eegclip_rank_local_gather_math or eegclip_actual_ddp_wrapper_matches_full_batch_gradient or eegclip_distributed_loss_matches_concatenated_batch"
