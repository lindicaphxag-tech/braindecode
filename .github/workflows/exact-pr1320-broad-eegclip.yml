name: Exact PR-head EEGCLIP broad integration and DDP validation
on:
  push:
    branches: ["validation/eegclip-comprehensive-scope-exact-20261013"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-model-regressions:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert production sources and tests are the EXACT original official #1320 PR head
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "b3a30049eaf5542988f8abd708505d8f32754fd5"
          git diff --name-only HEAD^ HEAD
      - name: Install actual Braindecode tests extra, not an isolated mocked copy
        run: python -m pip install --disable-pip-version-check -e ".[tests]"
      - name: Exercise every EEGCLIP named real-model and real DDP regression in upstream model tests
        env:
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python -m pytest -q test/unit_tests/models/test_models.py -k "eegclip" -ra --durations=10
