name: EEGCLIP DDP exact-PR-head full model suite triage (no upstream diff)
on:
  push:
    branches: ["validation/eegclip-ddp-exact-head-fullscope-20261013"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-model-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        selection:
          - eegclip-core
          - model-unit-no-compile
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - name: Prove original Braindecode PR source remains untouched by validation
        shell: bash
        run: |
          git cat-file -e 'b3a30049eaf5542988f8abd708505d8f32754fd5^{commit}'
          git diff --name-only b3a30049eaf5542988f8abd708505d8f32754fd5 HEAD | tee /tmp/all_source_diffs
          test -s /tmp/all_source_diffs
          test "$(cat /tmp/all_source_diffs)" = ".github/workflows/eegclip-ddp-exact-head-model-triage.yml"
      - name: Install current exact PR model with official suite dependencies
        run: uv pip install --system -e ".[tests,moabb,hub,eegprep,typing,viz]" pytest-timeout
      - name: Run model-unit exact head without blanket xdist or coverage race
        shell: bash
        run: |
          if [ "${{ matrix.selection }}" = "eegclip-core" ]; then
            python -m pytest -vv -o faulthandler_timeout=180 --timeout=180 --timeout-method=thread --durations=20 test/unit_tests/models/ -k 'eegclip and not test_model_compiled' -n 0
          else
            python -m pytest -vv -o faulthandler_timeout=180 --timeout=180 --timeout-method=thread --durations=30 test/unit_tests/models/test_models.py -k 'not test_model_compiled and not eegclip' -n 2 --dist worksteal
          fi
