name: EEG-CLIP #1320 exact source two-rank DDP correctness

on:
  push:
    branches:
      - validation/eegclip-1320-exact-head-gloo-20261013
    paths:
      - .github/workflows/eegclip-1320-exact-head-gloo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-exact-two-rank-gloo:
    name: Native two-rank gradient / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 35950f8ae95917868cc940a01a03ea30aad0e7ff
          persist-credentials: false
      - name: Verify exact current upstream-reviewed PR source
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="35950f8ae95917868cc940a01a03ea30aad0e7ff"
          echo "Verified frozen EEGCLIP PR source: $actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native Braindecode and its declared test requirements
        run: |
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install --disable-pip-version-check -e ".[tests]"
      - name: Native CPU group, unequal rank samples, autograd parity
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pytest -q -s test/unit_tests/models/test_models.py -k "eegclip_distributed_loss_matches_concatenated_batch" --maxfail=1 --disable-warnings
